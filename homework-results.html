<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Results - Wizbee</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
        }

        .header-info {
            text-align: right;
        }

        .theme-name {
            font-size: 18px;
            color: #667eea;
        }

        .share-code {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 5px;
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
        }

        .summary-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .summary-card .label {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 5px;
        }

        .summary-card.success .value {
            color: #48bb78;
        }

        .summary-card.warning .value {
            color: #ffc107;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tab.active {
            background: #667eea;
        }

        /* Student List */
        .student-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        .student-row {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px 120px 120px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .student-row:hover:not(.header) {
            background: rgba(255, 255, 255, 0.05);
        }

        .student-row.header {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            color: #a0aec0;
            font-size: 14px;
            cursor: default;
        }

        .student-row.first-place {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
        }

        .student-row.second-place {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.1), rgba(192, 192, 192, 0.03));
        }

        .student-row.third-place {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.1), rgba(205, 127, 50, 0.03));
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
        }

        .rank-1 { color: #ffd700; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }

        .student-name {
            font-size: 16px;
        }

        .stat {
            text-align: center;
        }

        .stat.solved {
            color: #48bb78;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.completed {
            background: #48bb78;
            color: white;
        }

        .status-badge.in-progress {
            background: #ffc107;
            color: #1a1a2e;
        }

        .status-badge.not-started {
            background: rgba(255, 255, 255, 0.2);
            color: #a0aec0;
        }

        /* Student Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #1a1a2e;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 28px;
            cursor: pointer;
        }

        .word-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .word-result .word-info {
            flex: 1;
        }

        .word-result .word {
            font-weight: 600;
            font-size: 18px;
        }

        .word-result .clue {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 5px;
        }

        .word-result .result-stats {
            text-align: right;
        }

        .word-result .result-icon {
            font-size: 24px;
        }

        .word-result.solved {
            border-left: 4px solid #48bb78;
        }

        .word-result.gave-up {
            border-left: 4px solid #e53e3e;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
        }

        .loading img {
            width: 80px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Student View Specific */
        .my-results {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .my-results h2 {
            margin-bottom: 20px;
        }

        .my-rank {
            font-size: 64px;
            font-weight: bold;
            color: #ffc107;
        }

        .my-rank-label {
            font-size: 18px;
            color: #a0aec0;
        }

        .my-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .my-stat {
            text-align: center;
        }

        .my-stat .value {
            font-size: 28px;
            font-weight: bold;
        }

        .my-stat .label {
            font-size: 14px;
            color: #a0aec0;
        }

        /* Homework Info Bar */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .info-bar .expires {
            color: #ffc107;
        }

        .info-bar .expires.expired {
            color: #e53e3e;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn.primary {
            background: #667eea;
            color: white;
        }

        .action-btn.danger {
            background: #e53e3e;
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* Back Link */
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading -->
        <div id="loading" class="loading">
            <img src="bee4.png" alt="Loading...">
            <p style="margin-top: 15px; color: #a0aec0;">Loading results...</p>
        </div>

        <!-- Main Content -->
        <div id="content" style="display: none;">
            <a href="index.html" class="back-link">&#8592; Back to Home</a>

            <div class="header">
                <div>
                    <h1>Homework Results</h1>
                    <div class="share-code">Code: <span id="shareCode">----</span></div>
                </div>
                <div class="header-info">
                    <div class="theme-name" id="themeName">Theme</div>
                    <div id="totalWords" style="color: #a0aec0; margin-top: 5px;">0 words</div>
                </div>
            </div>

            <!-- Info Bar -->
            <div class="info-bar">
                <div>Created: <span id="createdAt">-</span></div>
                <div class="expires" id="expiresInfo">Expires: -</div>
            </div>

            <!-- My Results (Student View Only) -->
            <div id="my-results-section" class="my-results" style="display: none;">
                <h2>Your Results</h2>
                <div class="my-rank" id="myRank">-</div>
                <div class="my-rank-label">out of <span id="totalStudents">0</span> students</div>
                <div class="my-stats">
                    <div class="my-stat">
                        <div class="value" id="myWordsSolved">0</div>
                        <div class="label">Solved</div>
                    </div>
                    <div class="my-stat">
                        <div class="value" id="myGuesses">0</div>
                        <div class="label">Guesses</div>
                    </div>
                    <div class="my-stat">
                        <div class="value" id="myTime">0s</div>
                        <div class="label">Time</div>
                    </div>
                </div>
            </div>

            <!-- Summary Cards (Teacher View Only) -->
            <div id="summary-section" class="summary-cards" style="display: none;">
                <div class="summary-card">
                    <div class="value" id="totalStudentsCard">0</div>
                    <div class="label">Total Students</div>
                </div>
                <div class="summary-card success">
                    <div class="value" id="completedCount">0</div>
                    <div class="label">Completed</div>
                </div>
                <div class="summary-card warning">
                    <div class="value" id="inProgressCount">0</div>
                    <div class="label">In Progress</div>
                </div>
                <div class="summary-card">
                    <div class="value" id="averageScore">0</div>
                    <div class="label">Avg. Score</div>
                </div>
            </div>

            <!-- Leaderboard -->
            <h3 style="margin-bottom: 15px;">Leaderboard</h3>
            <div class="student-list">
                <div class="student-row header">
                    <div>#</div>
                    <div>Student</div>
                    <div style="text-align: center;">Solved</div>
                    <div style="text-align: center;">Guesses</div>
                    <div style="text-align: center;">Time</div>
                    <div style="text-align: center;">Status</div>
                </div>
                <div id="studentList"></div>
            </div>

            <!-- Teacher Actions -->
            <div id="teacher-actions" class="actions" style="display: none;">
                <button id="closeHomeworkBtn" class="action-btn danger">Close Homework</button>
            </div>
        </div>
    </div>

    <!-- Student Detail Modal -->
    <div id="student-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalStudentName">Student</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="homework-results.js"></script>
</body>
</html>
