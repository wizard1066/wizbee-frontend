<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Wizbee</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <img
                    id="debugPollBtn"
                    src="bee4.png"
                    alt="Poll"
                    style="height: 48px; vertical-align: middle;"
                    onmouseover="this.style.transform='scale(1.1)'"
                    onmouseout="this.style.transform='scale(1)'"
                >
                <span style="color: #f59e0b;">Wizbee</span>
            </a>
        </h1>

        <!-- Loading Message -->
        <div id="loadingMessage" style="text-align: center; padding: 60px; color: #718096;">
            <img src="bee4.png" style="height: 60px;"><br>
            Loading game...
        </div>

        <!-- Game Board -->
        <div id="gameScreen" class="game-screen">
            <div class="theme-display">Theme: <span id="selectedTheme"></span></div>

            <!-- CLUE DISPLAY -->
            <div id="clueDisplay" class="clue-display hidden" style="
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px;
                border-radius: 12px;
                margin: 20px 0;
                text-align: center;
                font-size: 18px;
                font-weight: 600;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            ">
                <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">💡 Clue</div>
                <div id="clueText"></div>
            </div>

            <div id="wordBoxes" class="word-boxes"></div>
            <div class="guesses-remaining">Guesses remaining: <span id="guessesRemaining"></span></div>
            <div id="keyboard" class="keyboard" hidden></div>

            <input
                type="text"
                id="guessInput"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="characters"
                style="
                    position: absolute;
                    left: -9999px;
                    width: 1px;
                    height: 1px;
                    opacity: 0;
                "
            />

            <div class="guess-input-container">
                <button id="submitGuess" class="submit-guess" onclick="submitGuess()">Submit Word</button>
                <button id="showClueBtn" class="hint-btn" onclick="showClue()">💡 Show Clue</button>
                <button id="giveUpBtn" class="give-up-btn" onclick="giveUp()">Give Up</button>
            </div>

            <div id="hintDisplay" class="hint-display hidden"></div>
            <div id="previousGuesses" class="previous-guesses"></div>
            <div id="gameMessage" class="message"></div>
            <button id="resetButton" class="play-again hidden" onclick="nextWord()">Next Word →</button>
            <button id="backButton" class="play-again hidden" onclick="returnToBrowse()" style="background: #e2e8f0; color: #2d3748;">← Exit Game</button>
        </div>

        <!-- Game Summary Modal -->
        <div id="summaryOverlay" class="summary-overlay hidden">
            <div class="summary-modal">
                <h2>🎮 Game Complete!</h2>
                <div id="summaryContent"></div>
                <button onclick="shareResults()" class="play-again" style="background: #22c55e; margin-top: 10px;">
                    Share Results
                </button>
                <button onclick="closeSummary()" class="play-again" style="margin-top: 20px;">
                    Back to Browse
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden" style="text-align: center; padding: 60px; color: #e53e3e;">
            Failed to load game. <a href="browse.html">Return to browse</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.wizbee.app';
        let authToken = null;

        // Game state
        let wordList = [];
        let currentWordIndex = 0;
        let currentWord = '';
        let currentGuess = '';
        let remainingGuesses = 0;
        let maxGuesses = 8;
        let guessHistory = [];
        let gameOver = false;
        let selectedThemeWord = '';
        let currentLanguage = 'en';
        let winMessage = 'Correct!';
        let loseMessage = 'Not quite! The word was';
        let wordClues = [];
        let clueDirection = '';
        let currentClueTimeout = null;
        let hintsUsed = 0;
        let clueViewCount = 0;
        let wordStartTime = null;
        let letterSwapCount = 0;
        let gameResults = [];
        let currentGameData = null;
        let currentThemeId = null;
        let currentCacheKey = null;

        // ============================================================================
        // MULTIPLAYER FUNCTIONS
        // ============================================================================

        let isMultiplayerGame = false;
        let multiplayerCode = null;
        let pollInterval = null;

        // ============================================================================
        // GUEST PLAYER SUPPORT
        // ============================================================================

        let isGuestPlayer = false;
        let guestGameCode = null;
        let guestPlayerName = null;

        function getAuthHeaders() {
            console.log('[AUTH HEADERS] isGuestPlayer:', isGuestPlayer, 'authToken:', !!authToken, 'guestGameCode:', guestGameCode);
            if (isGuestPlayer && guestGameCode && guestPlayerName) {
                return {
                    'X-Game-Code': guestGameCode,
                    'X-Player-Name': encodeURIComponent(guestPlayerName)
                };
            }
            if (!authToken) {
                console.error('[AUTH HEADERS] WARNING: No authToken available!');
            }
            return {
                'Authorization': `Bearer ${authToken}`
            };
        }

        // ============================================================================
        // SOCKET.IO CONNECTION
        // ============================================================================

        let socket = null;

        /**
         * Initialize Socket.IO connection for multiplayer
         */
        function initializeSocket() {
            if (!multiplayerCode) {
                console.log('[SOCKET] No multiplayer game - skipping socket connection');
                return;
            }

            console.log('[SOCKET] Connecting to server...');
            console.log('[SOCKET] isGuestPlayer:', isGuestPlayer);
            console.log('[SOCKET] authToken exists:', !!authToken);

            // Build auth object based on player type
            let socketAuth;
            if (isGuestPlayer && guestGameCode && guestPlayerName) {
                socketAuth = {
                    gameCode: guestGameCode,
                    playerName: guestPlayerName
                };
                console.log('[SOCKET] Using guest auth:', guestPlayerName);
            } else {
                socketAuth = {
                    token: authToken
                };
                console.log('[SOCKET] Using JWT auth');
            }

            socket = io('https://api.wizbee.app', {
                auth: socketAuth,
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });

            socket.on('game_completed', (data) => {
                console.log('[SOCKET] 🏁 Game completed!');

                const messageDiv = document.getElementById('gameMessage');
                messageDiv.textContent = '🏁 Game Complete! All words finished.';
                messageDiv.className = 'message win';

                document.getElementById('submitGuess').classList.add('hidden');
                document.getElementById('showClueBtn').classList.add('hidden');
                document.getElementById('giveUpBtn').classList.add('hidden');

                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🎉 View Summary';
                resetBtn.classList.remove('hidden');
                resetBtn.disabled = false;
                resetBtn.onclick = showGameSummary;
            });

            socket.on('opponent_advanced', async (data) => {
                console.log('[SOCKET] 🎯 Opponent advanced to index:', data.newIndex);
                console.log('[SOCKET] Solver:', data.solver);

                // Check if we solved it (either as user or guest)
                const myIdentity = isGuestPlayer ? guestPlayerName : localStorage.getItem('userEmail');

                if (data.solver === myIdentity) {
                    console.log('[SOCKET] Ignoring - we solved it ourselves');
                    return;
                }

                // Only react if we're behind
                if (data.newIndex > currentWordIndex) {
                    gameResults.push({
                        word: wordList[currentWordIndex],
                        won: false,
                        solvedByOpponent: true,
                        solverName: data.solver,
                        guesses: 0,
                        timeSeconds: 0,
                        cluesViewed: 0
                    });

                    await animateOpponentSolution();
                    showOpponentSolvedMessage(data.solver);
                    await delay(2000);

                    if (data.newIndex >= wordList.length) {
                        console.log('[SOCKET] Last word solved - game complete!');

                        const messageDiv = document.getElementById('gameMessage');
                        messageDiv.textContent = '🏁 Game Complete! All words finished.';
                        messageDiv.className = 'message win';

                        document.getElementById('submitGuess').classList.add('hidden');
                        document.getElementById('showClueBtn').classList.add('hidden');
                        document.getElementById('giveUpBtn').classList.add('hidden');

                        const resetBtn = document.getElementById('resetButton');
                        resetBtn.textContent = '🎉 View Summary';
                        resetBtn.classList.remove('hidden');
                        resetBtn.disabled = false;
                        resetBtn.onclick = showGameSummary;

                        return;
                    }

                    jumpToWord(data.newIndex);

                    document.getElementById('submitGuess').classList.remove('hidden');
                    document.getElementById('showClueBtn').classList.remove('hidden');
                    document.getElementById('giveUpBtn').classList.remove('hidden');

                    const resetBtn = document.getElementById('resetButton');
                    if (data.newIndex < wordList.length - 1) {
                        resetBtn.classList.add('hidden');
                    }

                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Next Word →';

                    const msg = document.getElementById('gameMessage');
                    if (msg) {
                        msg.textContent = '';
                        msg.className = 'message';
                    }

                    gameOver = false;
                }
            });

            socket.on('player_joined', (data) => {
                console.log('[SOCKET] 👋 Another player joined:', data.playerEmail || 'unknown');
            });

            socket.on('game_completed', (data) => {
                console.log('[SOCKET] 🏁 Game completed by:', data.winner);
            });

            socket.on('error', (data) => {
                console.error('[SOCKET] ❌ Server error:', data.message);
                alert(`Game error: ${data.message}`);
            });

            socket.on('connect_error', (error) => {
                console.error('[SOCKET] ❌ Connection error:', error.message);

                if (error.message === 'Authentication required' || error.message.includes('Invalid')) {
                    console.error('[SOCKET] Authentication failed - token may be expired');
                    alert('Session expired. Please refresh the page and log in again.');
                } else {
                    console.log('[SOCKET] Connection failed - use bee button for manual polling');
                }
            });

            socket.on('disconnect', (reason) => {
                console.log('[SOCKET] ⚠️ Disconnected:', reason);
                console.log('[SOCKET] Use bee button as fallback or wait for reconnection');
            });

            socket.on('player_skipped', (data) => {
                console.log('[SOCKET] 👋 Opponent skipped word:', data.wordIndex);
                console.log('[SOCKET] Skipper:', data.skipper);

                const msg = document.createElement('div');
                msg.style.cssText = `
                    position: fixed;
                    top: 20%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #f59e0b;
                    color: white;
                    padding: 15px 30px;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 9999;
                `;
                msg.textContent = '⏭️ Opponent skipped this word';
                document.body.appendChild(msg);

                setTimeout(() => msg.remove(), 2000);
            });

            socket.on('skip_requested', (data) => {
                console.log('[SOCKET] 👋 Opponent requested skip for word:', data.word);
                console.log('[SOCKET] Requester:', data.requester);

                const currentUserEmail = localStorage.getItem('userEmail');

                if (data.requester === currentUserEmail) {
                    console.log('[SOCKET] Ignoring - we requested the skip');
                    return;
                }

                showSkipRequestModal(data.requester, data.word);
            });

            socket.on('skip_declined', (data) => {
                console.log('[SOCKET] 🚫 Skip declined by:', data.decliner);

                const currentUserEmail = localStorage.getItem('userEmail');

                if (data.decliner === currentUserEmail) {
                    console.log('[SOCKET] Ignoring - we declined');
                    return;
                }

                const resetBtn = document.getElementById('resetButton');
                const msg = document.getElementById('gameMessage');

                resetBtn.disabled = false;
                resetBtn.textContent = 'Next Word →';

                if (msg) {
                    msg.textContent = '💪 Opponent wants to keep trying!';
                    msg.className = 'message';
                }

                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #f59e0b;
                    color: white;
                    padding: 20px 40px;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 9999;
                `;
                notification.textContent = 'Opponent is still trying to solve it!';
                document.body.appendChild(notification);
                setTimeout(() => notification.remove(), 3000);
            });

            socket.on('both_skipped', async (data) => {
                console.log('[SOCKET] ⏭️ Both players skipped! Advancing to:', data.newIndex);

                gameResults.push({
                    word: wordList[currentWordIndex],
                    won: false,
                    bothSkipped: true,
                    guesses: 0,
                    timeSeconds: 0,
                    cluesViewed: 0
                });

                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #667eea;
                    color: white;
                    padding: 20px 40px;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 9999;
                `;
                notification.textContent = '⏭️ Both skipped - moving to next word';
                document.body.appendChild(notification);

                await delay(2000);
                notification.remove();

                jumpToWord(data.newIndex);

                // Re-enable game controls
                document.getElementById('submitGuess').classList.remove('hidden');
                document.getElementById('showClueBtn').classList.remove('hidden');
                document.getElementById('giveUpBtn').classList.remove('hidden');

                const resetBtn = document.getElementById('resetButton');
                resetBtn.classList.add('hidden');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Next Word →';

                const msg = document.getElementById('gameMessage');
                if (msg) {
                    msg.textContent = '';
                    msg.className = 'message';
                }
            });

            socket.on('connect', () => {
                console.log('[SOCKET] ✅ Connected:', socket.id);

                socket.emit('join_game', multiplayerCode);
                console.log('[SOCKET] Requesting to join room:', multiplayerCode);
            });
        }

        function initMultiplayer() {
            multiplayerCode = localStorage.getItem('sharedGameCode');
            isMultiplayerGame = !!multiplayerCode;

            if (isMultiplayerGame) {
                console.log('[MULTIPLAYER] Joined game:', multiplayerCode);

                // Sync state when page becomes visible again (e.g., returning from monitor)
                document.addEventListener('visibilitychange', async () => {
                    if (!document.hidden && isMultiplayerGame && multiplayerCode) {
                        console.log('[SYNC] Page visible - checking for game updates...');
                        await syncGameState();
                    }
                });
            }
        }

        /**
         * Sync local game state with server (used when returning to page)
         */
        async function syncGameState() {
            if (!multiplayerCode) return;

            try {
                const response = await fetch(`${API_URL}/api/poll-game/${multiplayerCode}`, {
                    headers: getAuthHeaders()
                });

                const data = await response.json();

                if (!data.success) {
                    console.log('[SYNC] Game ended or not found');
                    return;
                }

                console.log('[SYNC] Server index:', data.currentIndex, 'Local index:', currentWordIndex);

                if (data.currentIndex > currentWordIndex) {
                    console.log('[SYNC] Game advanced while away - catching up...');

                    // Mark missed words as opponent-solved
                    while (currentWordIndex < data.currentIndex && currentWordIndex < wordList.length) {
                        gameResults.push({
                            word: wordList[currentWordIndex],
                            won: false,
                            solvedByOpponent: true,
                            guesses: 0,
                            timeSeconds: 0,
                            cluesViewed: 0
                        });
                        currentWordIndex++;
                    }

                    // Jump to current position
                    if (data.currentIndex < wordList.length) {
                        jumpToWord(data.currentIndex);
                    } else {
                        // Game completed while away
                        document.getElementById('submitGuess').classList.add('hidden');
                        document.getElementById('showClueBtn').classList.add('hidden');
                        document.getElementById('giveUpBtn').classList.add('hidden');

                        const resetBtn = document.getElementById('resetButton');
                        resetBtn.textContent = '🎉 View Summary';
                        resetBtn.classList.remove('hidden');
                        resetBtn.disabled = false;
                        resetBtn.onclick = showGameSummary;

                        document.getElementById('gameMessage').textContent = '🏁 Game Complete!';
                    }
                }

            } catch (error) {
                console.error('[SYNC] Error syncing game state:', error);
            }
        }

        /**
         * Simple delay helper
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /**
         * Animate the opponent's answer letter-by-letter
         */
        async function animateOpponentSolution() {
            const word = wordList[currentWordIndex];
            const boxes = document.querySelectorAll('.letter-box');

            console.log('[ANIMATION] Showing opponent solution:', word);

            boxes.forEach(box => {
                box.textContent = '';
                box.classList.remove('correct', 'present', 'absent', 'active-input');
            });

            const startIdx = clueDirection === 'RL' ? word.length - 1 : 0;
            const endIdx = clueDirection === 'RL' ? -1 : word.length;
            const step = clueDirection === 'RL' ? -1 : 1;

            for (let i = startIdx; i !== endIdx; i += step) {
                const box = boxes[i];
                box.textContent = word[i];
                box.classList.add('correct');

                box.style.animation = 'none';
                setTimeout(() => {
                    box.style.animation = 'pop 0.3s ease-in-out';
                }, 10);

                await delay(150);
            }

            await delay(300);
            boxes.forEach((box, i) => {
                if (i < word.length) {
                    box.style.animation = 'pulse 0.5s ease-in-out';
                }
            });

            await delay(800);
        }

        /**
         * Debug: Manual poll trigger
         */
        async function debugPoll() {
            console.log('[DEBUG POLL START] authToken:', localStorage.getItem('authToken'));
            console.log('[DEBUG POLL START] authToken global var:', authToken);
            const bee = document.getElementById('debugPollBtn');

            bee.style.transform = 'rotate(360deg)';
            bee.style.transition = 'transform 0.5s';

            try {
                if (!multiplayerCode) {
                    console.log('[DEBUG] No multiplayer game active');
                    return;
                }

                console.log('[DEBUG] Polling game:', multiplayerCode);

                const response = await fetch(`${API_URL}/api/poll-game/${multiplayerCode}`, {
                    headers: getAuthHeaders()
                });

                const data = await response.json();

                console.log('[DEBUG] Poll result:', data);
                console.log('[DEBUG] Current word index:', currentWordIndex);
                console.log('[DEBUG] Server current index:', data.currentIndex);

                if (data.currentIndex > currentWordIndex) {
                    console.log('[DEBUG] ✅ Opponent advanced!');

                    gameResults.push({
                        word: wordList[currentWordIndex],
                        won: false,
                        solvedByOpponent: true,
                        guesses: 0,
                        timeSeconds: 0,
                        cluesViewed: 0
                    });

                    await animateOpponentSolution();
                    showOpponentSolvedMessage();
                    await delay(2000);
                    jumpToWord(data.currentIndex);
                } else {
                    console.log('[DEBUG] ⏸️ No change detected');
                }

            } catch (error) {
                console.error('[DEBUG] Poll error:', error);
            } finally {
                console.log('[DEBUG POLL END] authToken:', localStorage.getItem('authToken'));
                setTimeout(() => {
                    bee.style.transform = 'rotate(0deg)';
                }, 100);
            }
        }

        /**
         * Convert email to display name (e.g., "john.doe@school.com" -> "John Doe")
         */
        function formatPlayerName(name) {
            if (!name) return 'Opponent';
            // If it's an email, extract and format the part before @
            if (name.includes('@')) {
                const localPart = name.split('@')[0];
                // Replace dots/underscores with spaces and capitalize each word
                return localPart
                    .replace(/[._]/g, ' ')
                    .split(' ')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                    .join(' ');
            }
            return name;
        }

        /**
         * Show message when opponent solves
         */
        function showOpponentSolvedMessage(solverName) {
            const displayName = formatPlayerName(solverName);
            const msg = document.createElement('div');
            msg.style.cssText = `
                position: fixed;
                top: 20%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
                color: white;
                padding: 30px 50px;
                border-radius: 16px;
                font-size: 28px;
                font-weight: bold;
                z-index: 9999;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                animation: slideIn 0.3s ease-out;
            `;
            msg.textContent = `${displayName} solved it!`;
            document.body.appendChild(msg);

            setTimeout(() => {
                msg.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => msg.remove(), 300);
            }, 2000);
        }

        function jumpToWord(newIndex) {
            console.log(`[MULTIPLAYER] Jumping from word ${currentWordIndex} to ${newIndex}`);

            hideClue();

            if (newIndex >= wordList.length) {
                console.log('[MULTIPLAYER] Game complete! No more words.');

                document.getElementById('submitGuess').classList.add('hidden');
                document.getElementById('showClueBtn').classList.add('hidden');
                document.getElementById('giveUpBtn').classList.add('hidden');

                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🎉 View Summary';
                resetBtn.classList.remove('hidden');
                resetBtn.disabled = false;
                resetBtn.onclick = showGameSummary;

                const messageDiv = document.getElementById('gameMessage');
                messageDiv.textContent = '🏁 Game Complete!';
                messageDiv.className = 'message win';

                return;
            }

            currentWordIndex = newIndex;
            currentWord = wordList[newIndex];
            currentGuess = '';
            guessHistory = [];
            guessesUsed = 0;
            remainingGuesses = maxGuesses;
            gameOver = false;

            createWordBoxes();
            updateGuessCount();
            resetKeyboard();
            hideClue();

            document.getElementById('previousGuesses').innerHTML = '';
            document.getElementById('gameMessage').textContent = '';
            document.getElementById('selectedTheme').textContent = `${selectedThemeWord} (${currentWordIndex + 1}/${wordList.length})`;

            if (newIndex >= wordList.length - 1) {
                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🏁 No More Words';
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.6';
                resetBtn.style.cursor = 'not-allowed';
                resetBtn.classList.remove('hidden');

                console.log('[GAME] Last word - showing "No More Words" button');
            }

            if (wordClues.length > newIndex) {
                showClueAuto(20000);
            }

            console.log(`[MULTIPLAYER] Now on word: ${currentWord}`);
        }

        /**
         * Reset keyboard colors
         */
        function resetKeyboard() {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'used');
            });
        }

        async function shareGame() {
            console.log('[SHARE] Running shareGame()');
            const btn = document.getElementById('showClueBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Creating...';

            console.log('[SHARE] Reading from localStorage...');
            const rawData = localStorage.getItem('pendingGame');
            console.log('[SHARE] Raw pendingGame:', rawData);

            const gameData = JSON.parse(rawData);
            console.log('[SHARE] Parsed gameData:', gameData);

            const cacheKey = gameData?.cacheKey;
            console.log('[SHARE] Extracted cacheKey:', cacheKey);

            if (!cacheKey) {
                alert('Error: No game loaded');
                btn.disabled = false;
                btn.textContent = '📤 Share Game';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/create-shared-game`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cacheKey: cacheKey,
                        clues: wordClues,
                        words: wordList
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    alert('Failed to create shared game');
                    btn.disabled = false;
                    btn.textContent = '📤 Share Game';
                    return;
                }

                multiplayerCode = data.shareCode;
                isMultiplayerGame = true;

                console.log('[MULTIPLAYER] Initializing Socket.IO for code:', data.shareCode);
                initializeSocket();

        function getFeedbackForGuessDepreciated(guess) {
            const feedback = [];
            const wordArray = currentWord.split('');

            const usedIndices = new Set();

            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === wordArray[i]) {
                    feedback[i] = 'correct';
                    usedIndices.add(i);
                }
            }

            for (let i = 0; i < guessArray.length; i++) {
                if (feedback[i] !== 'correct') {

                    for (let j = 0; j < wordArray.length; j++) {

                    }

                    }
                }
            }

        function drawWordPoolVisualization(totalWords, selectedIndices) {
            const canvas = document.getElementById('wordPoolCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#48bb78');
            gradient.addColorStop(0.5, '#ed8936');
            gradient.addColorStop(1, '#f56565');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 20, width, 20);

            ctx.fillStyle = '#718096';
            ctx.font = '12px Arial';
            ctx.fillText('Easy', 10, 15);
            ctx.fillText('Hard', width - 35, 15);

            if (selectedIndices && selectedIndices.length > 0) {
                selectedIndices.forEach(index => {
                    const x = (index / totalWords) * width;

                    ctx.fillStyle = '#2d3748';
                    ctx.beginPath();
                    ctx.arc(x, 30, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }
        }

        function submitGuess() {
            if (currentGuess.length !== currentWord.length) return;
            if (gameOver) return;

            const guess = currentGuess.toUpperCase();
            guessHistory.push(guess);

            updatePreviousGuesses();

            const feedback = [];
            const wordArray = currentWord.split('');
            const guessArray = guess.split('');
            const usedIndices = new Set();

            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === wordArray[i]) {
                    feedback[i] = 'correct';
                    usedIndices.add(i);
                }
            }

            for (let i = 0; i < guessArray.length; i++) {
                if (feedback[i] !== 'correct') {
                    let found = false;
                    for (let j = 0; j < wordArray.length; j++) {
                        if (!usedIndices.has(j) && guessArray[i] === wordArray[j]) {
                            feedback[i] = 'present';
                            usedIndices.add(j);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        feedback[i] = 'incorrect';
                    }
                }
            }

            updateKeyboard(guess, feedback);

            remainingGuesses--;
            updateGuessCount();

            if (guess === currentWord) {
                endGame(true);
            } else if (remainingGuesses === 0) {
                endGame(false);
            }

            if (guess != currentWord) {
                currentGuess = '';
                updateWordBoxes();
            }
        }

        function updateKeyboard(guess, feedback) {
            for (let i = 0; i < guess.length; i++) {
                const letter = guess[i];
                const keys = document.querySelectorAll('.key');

                keys.forEach(key => {
                    if (key.textContent === letter) {
                        if (feedback[i] === 'correct' && !key.classList.contains('correct')) {
                            key.classList.remove('present', 'used');
                            key.classList.add('correct');
                        } else if (feedback[i] === 'present' && !key.classList.contains('correct')) {
                            key.classList.remove('used');
                            key.classList.add('present');
                        } else if (feedback[i] === 'incorrect' && !key.classList.contains('correct') && !key.classList.contains('present')) {
                            key.classList.add('used');
                        }
                    }
                });
            }
        }

        function updatePreviousGuesses() {

            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === currentWord[i]) {
                    feedback[i] = 'correct';
                    wordCopy[i] = null;
                    guessCopy[i] = null;
                }
            }

            for (let i = 0; i < guess.length; i++) {
                if (guessCopy[i] !== null) {
                    const index = wordCopy.indexOf(guessCopy[i]);
                    if (index !== -1) {
                        feedback[i] = 'present';
                        wordCopy[index] = null;
                    }
                }
            }

            let fontSizeClass = '';
            if (currentWord.length > 9) fontSizeClass = 'tiny-font';
            else if (currentWord.length > 6) fontSizeClass = 'small-font';

            for (let i = 0; i < guess.length; i++) {
                const box = document.createElement('div');
                box.className = `letter-box ${feedback[i]} ${fontSizeClass}`;
                box.textContent = guess[i];

                        won: won,
                        letterSwaps: letterSwapCount,
                        guessHistory: guessHistory,
                        timeSeconds: Math.floor((Date.now() - wordStartTime) / 1000)
                    })
                });
            } catch (error) {
                console.error('Failed to record:', error);
            }
        }

        function celebrateWin() {
            for (let i = 0; i < currentWord.length; i++) {
                const box = document.getElementById(`box-${i}`);
                if (box) {
                    box.textContent = currentWord[i];
                    box.classList.add('correct');
                }
            }

            for (let i = 0; i < currentWord.length; i++) {
                const box = document.getElementById(`box-${i}`);
                if (box) {
                    setTimeout(() => box.classList.add('flash'), i * 150);
                    setTimeout(() => box.classList.remove('flash'), i * 150 + 1000);
                    setTimeout(() => box.classList.add('flash'), i * 150 + 1200);
                    setTimeout(() => box.classList.remove('flash'), i * 150 + 2200);
                }
            }
        }

        function celebrateWinDefunctDepreciated() {
            for (let i = 0; i < currentWord.length; i++) {
                const box = document.getElementById(`box-${i}`);
                setTimeout(() => box.classList.add('flash'), i * 150);
                setTimeout(() => box.classList.remove('flash'), i * 150 + 1000);
                setTimeout(() => box.classList.add('flash'), i * 150 + 1200);
                setTimeout(() => box.classList.remove('flash'), i * 150 + 2200);
            }
        }

        function showGameSummary() {
            console.log('=== SHOW GAME SUMMARY ===');
            console.log('gameResults:', gameResults);
            console.trace('Call stack:');
            console.log('gameResults.length:', gameResults.length);

            const totalWords = gameResults.length;
            const wordsWon = gameResults.filter(r => r.won).length;
            const totalTime = gameResults.reduce((sum, r) => sum + r.timeSeconds, 0);
            const totalGuesses = gameResults.reduce((sum, r) => sum + r.guesses, 0);
            const avgTime = Math.round(totalTime / totalWords);
            const avgGuesses = (totalGuesses / totalWords).toFixed(1);

            let html = `
                <div class="summary-stats">
                    <h3>📊 Overall Stats</h3>
                    <p><strong>Words Won:</strong> ${wordsWon}/${totalWords}</p>
                    <p><strong>Success Rate:</strong> ${Math.round((wordsWon/totalWords)*100)}%</p>
                    <p><strong>Average Time:</strong> ${avgTime}s per word</p>
                    <p><strong>Average Guesses:</strong> ${avgGuesses}</p>
                </div>

                <div class="summary-results">
                    <h3>📝 Word by Word</h3>
            `;

            gameResults.forEach((result, index) => {
                let icon, status;
                if (result.bothSkipped) {
                    icon = '⏭️';
                    status = '<span style="color: #667eea;">Both players skipped</span>';
                } else if (result.timedOut) {
                    icon = '⏰';
                    status = '<span style="color: #f59e0b;">Time expired</span>';
                } else if (result.solvedByOpponent) {
                    icon = '👤';
                    const solverDisplay = formatPlayerName(result.solverName);
                    status = `<span style="color: #667eea;">Solved by ${solverDisplay}</span>`;
                } else if (result.won) {
                    icon = '✅';
                    status = `${result.guesses} guesses, ${result.timeSeconds}s`;
                } else {
                    icon = '❌';
                    status = `${result.guesses} guesses, ${result.timeSeconds}s`;
                }

                html += `
                    <div style="padding: 10px; border-bottom: 1px solid #e2e8f0;">
                        ${icon} <strong>${result.word}</strong> - ${status}
                    </div>
                `;
            });

            html += '</div>';

            document.getElementById('summaryContent').innerHTML = html;
            document.getElementById('summaryOverlay').classList.remove('hidden');
        }

        function closeSummary() {
            document.getElementById('summaryOverlay').classList.add('hidden');
            window.location.href = 'browse.html';
        }

        async function endGame(won) {
            gameOver = true;
            hideClue();
            localStorage.removeItem('lastEditedTheme');

            await recordWordAttempt(won);

            gameResults.push({
                word: currentWord,
                won: won,
                guesses: maxGuesses - remainingGuesses,
                timeSeconds: Math.floor((Date.now() - wordStartTime) / 1000),
                cluesViewed: clueViewCount
            });

            const messageDiv = document.getElementById('gameMessage');

            if (won) {
                celebrateWin();
                messageDiv.textContent = `🎉 ${winMessage} ${currentWord}`;
                messageDiv.className = 'message win';

                if (isMultiplayerGame && multiplayerCode) {
                    console.log('[MULTIPLAYER] Solved! Broadcasting to opponent...');

                    if (currentWordIndex >= wordList.length) {
                        await delay(4000);
                        await completeMultiplayerGame();
                    } else {
                        await delay(2000);
                        await advanceMultiplayerGame();
                    }

                    return;
                }

            } else {
                // Animate the answer letter by letter
                const boxes = document.querySelectorAll('.letter-box');
                boxes.forEach(box => {
                    box.textContent = '';
                    box.classList.remove('correct', 'present', 'absent', 'active-input');
                });

                const startIdx = clueDirection === 'RL' ? currentWord.length - 1 : 0;
                const endIdx = clueDirection === 'RL' ? -1 : currentWord.length;
                const step = clueDirection === 'RL' ? -1 : 1;

                for (let i = startIdx; i !== endIdx; i += step) {
                    const box = boxes[i];
                    if (box) {
                        box.textContent = currentWord[i];
                        box.classList.add('correct');
                        box.style.animation = 'none';
                        setTimeout(() => { box.style.animation = 'pop 0.3s ease-in-out'; }, 10);
                        await delay(150);
                    }
                }

                messageDiv.textContent = `${loseMessage} ${currentWord}`;
                messageDiv.className = 'message lose';
            }

            document.getElementById('submitGuess').classList.add('hidden');
            document.getElementById('showClueBtn').classList.add('hidden');
            document.getElementById('giveUpBtn').classList.add('hidden');

            document.getElementById('resetButton').classList.add('hidden');
            document.getElementById('backButton').classList.add('hidden');

            const resetBtn = document.getElementById('resetButton');
            resetBtn.classList.remove('hidden');

            if (currentWordIndex >= wordList.length - 1) {
                resetBtn.textContent = '🏁 No More Words';
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.6';
                resetBtn.style.cursor = 'not-allowed';

                setTimeout(() => {
                    resetBtn.textContent = '🎉 View Summary';
                    resetBtn.disabled = false;
                    resetBtn.style.opacity = '1';
                    resetBtn.style.cursor = 'pointer';
                }, 2000);

            } else {
                if (!isMultiplayerGame) {
                    resetBtn.textContent = 'Next Word →';
                    resetBtn.disabled = false;
                } else {
                    resetBtn.classList.add('hidden');
                }
            }

            setTimeout(() => {
                messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        /**
         * Notify server that we're advancing to the next word
         */
        async function advanceMultiplayerGame() {
            if (!isMultiplayerGame || !multiplayerCode) {
                return;
            }

            try {
                console.log(`[MULTIPLAYER] Advancing from word ${currentWordIndex}`);

                const response = await fetch(`${API_URL}/api/advance-game`, {
                    method: 'POST',
                    headers: {
                        ...getAuthHeaders(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        shareCode: multiplayerCode,
                        fromIndex: currentWordIndex
                    })
                });

                const data = await response.json();

                if (data.success && data.advanced) {
                    console.log('[MULTIPLAYER] ✅ Successfully advanced game');

                    const newIndex = currentWordIndex + 1;

                    if (newIndex < wordList.length) {
                        await delay(500);
                        jumpToWord(newIndex);

                        document.getElementById('submitGuess').classList.remove('hidden');
                        document.getElementById('showClueBtn').classList.remove('hidden');
                        document.getElementById('giveUpBtn').classList.remove('hidden');
                    } else {
                        showGameSummary();
                    }

                } else if (data.success && !data.advanced) {
                    console.log('[MULTIPLAYER] ⚠️ Opponent beat us to it');
                } else {
                    console.error('[MULTIPLAYER] Failed to advance:', data.error);
                }

            } catch (error) {
                console.error('[MULTIPLAYER] Advance error:', error);
            }
        }

        /**
         * Notify server and opponent that game is complete
         */
        async function completeMultiplayerGame() {
            try {
                console.log('[MULTIPLAYER] Completing game:', multiplayerCode);

                const response = await fetch(`${API_URL}/api/complete-game`, {
                    method: 'POST',
                    headers: {
                        ...getAuthHeaders(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        shareCode: multiplayerCode
                    })
                });

                const data = await response.json();

                if (data.success) {
                    console.log('[MULTIPLAYER] Game marked as complete');
                }

            } catch (error) {
                console.error('[MULTIPLAYER] Complete game error:', error);
            }
        }

        function nextWord() {
            console.log('=== NEXT WORD CALLED ===');
            console.log('currentWordIndex:', currentWordIndex);
            console.log('wordList.length:', wordList.length);

            const lastResult = gameResults[gameResults.length - 1];
            if (lastResult && lastResult.won) {
                advanceMultiplayerGame();
            }

            if (currentWordIndex >= wordList.length - 1) {
                if (isMultiplayerGame && multiplayerCode) {
                    completeMultiplayerGame();
                }
                showGameSummary();
                return;
            }

            currentWordIndex++;
            currentWord = wordList[currentWordIndex];
            currentGuess = '';
            guessHistory = [];
            remainingGuesses = maxGuesses;
            gameOver = false;
            wordStartTime = Date.now();
            clueViewCount = 0;

            document.getElementById('selectedTheme').textContent = `${selectedThemeWord} (${currentWordIndex + 1}/${wordList.length})`;
            document.getElementById('gameMessage').textContent = '';
            document.getElementById('previousGuesses').innerHTML = '';
            document.getElementById('resetButton').classList.add('hidden');
            document.getElementById('backButton').classList.add('hidden');
            document.getElementById('submitGuess').classList.remove('hidden');
            document.getElementById('showClueBtn').classList.remove('hidden');
            document.getElementById('giveUpBtn').classList.remove('hidden');

            document.querySelectorAll('.key').forEach(key => {
                key.classList.remove('correct', 'present', 'used');
            });

            createWordBoxes();
            updateGuessCount();

            if (currentWordIndex >= wordList.length - 1) {
                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🏁 No More Words';
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.6';
                resetBtn.style.cursor = 'not-allowed';
                resetBtn.classList.remove('hidden');
            }

            const guessInput = document.getElementById('guessInput');
            if (guessInput) {
                guessInput.value = '';
                guessInput.maxLength = currentWord.length;
                guessInput.focus();
            }

            if (wordClues.length > currentWordIndex) {
                showClueAuto(20000);
            }
        }

        async function skipMultiplayerWordDepreciated() {
            if (!isMultiplayerGame || !multiplayerCode) return;

            try {
                console.log('[MULTIPLAYER] Skipping word:', currentWordIndex);

                const response = await fetch(`${API_URL}/api/skip-word`, {
                    method: 'POST',
                    headers: {
                        ...getAuthHeaders(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        shareCode: multiplayerCode,
                        wordIndex: currentWordIndex
                    })
                });

                const data = await response.json();

                if (data.success) {
                    console.log('[MULTIPLAYER] ✅ Skip broadcast to opponents');
                }

            } catch (error) {
                console.error('[MULTIPLAYER] Skip error:', error);
            }
        }

        async function giveUp() {
            console.log('[GAME] Player gave up on word:', currentWord);

            endGame(false);

            if (isMultiplayerGame && multiplayerCode) {
                try {
                    console.log('[MULTIPLAYER] Requesting skip from opponent');

                    await delay(4000);

                    const response = await fetch(`${API_URL}/api/request-skip`, {
                        method: 'POST',
                        headers: {
                            ...getAuthHeaders(),
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            shareCode: multiplayerCode,
                            wordIndex: currentWordIndex,
                            word: currentWord
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        console.log('[MULTIPLAYER] Skip request sent');
                        showWaitingForOpponent();
                    }

                } catch (error) {
                    console.error('[MULTIPLAYER] Skip request error:', error);
                }
            }
        }

        /**
         * Show waiting state after requesting skip
         */
        function showWaitingForOpponent() {
            const resetBtn = document.getElementById('resetButton');
            const msg = document.getElementById('gameMessage');

            resetBtn.textContent = '⏳ Waiting for opponent...';
            resetBtn.disabled = true;
            resetBtn.classList.remove('hidden');

            if (msg) {
                msg.textContent = 'Waiting for opponent to decide...';
                msg.className = 'message';
            }
        }

        function returnToBrowse() {
            window.location.href = 'browse.html';
        }

        async function generateAllClues() {
            // Guest players already have clues from the shared game data
            if (isGuestPlayer) {
                console.log('[CLUES] Guest player - using existing clues from game data');
                return;
            }

            const clueBtn = document.getElementById('showClueBtn');
            const originalText = clueBtn.textContent;
            clueBtn.disabled = true;
            clueBtn.textContent = '💭 Thinking...';
            clueBtn.style.background = '#cbd5e0';
            clueBtn.style.cursor = 'not-allowed';

            try {
                const response = await fetch(`${API_URL}/api/generate-clues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        words: wordList,
                        theme: selectedThemeWord,
                        language: currentLanguage,
                        difficulty: currentGameData.difficulty || 'medium'
                    })
                });

                const data = await response.json();

                if (data.clues) {
                    wordClues = data.clues;
                    if (data.winMessage) winMessage = data.winMessage;
                    if (data.loseMessage) loseMessage = data.loseMessage;
                    if (data.direction) clueDirection = data.direction;
                }
            } catch (error) {
                console.error('Error generating clues:', error);
            } finally {
                console.log('[CLUES] Finally block reached');
                clueBtn.disabled = false;

                const multiplayerCode = localStorage.getItem('sharedGameCode');
                const isMultiplayerGame = !!multiplayerCode;

                console.log('[CLUES] multiplayerCode:', multiplayerCode);
                console.log('[CLUES] isMultiplayerGame:', isMultiplayerGame);

                if (isMultiplayerGame) {
                    console.log('[CLUES] Setting button to Show Clue');
                    clueBtn.textContent = 'Show Clue';
                    clueBtn.onclick = showClue;
                } else {
                    console.log('[CLUES] Setting button to Share Game');
                    clueBtn.textContent = 'Share Game';
                    clueBtn.onclick = shareGame;
                }

                clueBtn.style.background = '';
                clueBtn.style.cursor = '';
                console.log('[CLUES] Button text is now:', clueBtn.textContent);
            }
        }

        function showClue() {
            if (wordClues.length > currentWordIndex) {
                document.getElementById('clueText').textContent = wordClues[currentWordIndex];
                document.getElementById('clueDisplay').classList.remove('hidden');
                clueViewCount++;
            }
        }

        function showClueAuto(duration) {
            if (currentClueTimeout) {
                clearTimeout(currentClueTimeout);
            }

            showClue();

            currentClueTimeout = setTimeout(() => {
                hideClue();
            }, duration);
        }

        function hideClue() {
            document.getElementById('clueDisplay').classList.add('hidden');
            if (currentClueTimeout) {
                clearTimeout(currentClueTimeout);
                currentClueTimeout = null;
            }
        }

        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('errorMessage').innerHTML = `${message}. <a href="browse.html">Return to browse</a>`;
        }

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (gameOver) return;

            if (e.key === 'Enter') {
                submitGuess();
            } else if (e.key === 'Backspace') {
                handleKeyPress('BACKSPACE');
            } else if (/^\p{L}$/u.test(e.key)) {
                handleKeyPress(e.key.toUpperCase());
            }
        });

        function scrambleDepreciated(word) {
            let arr = word.split("");
            do {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            } while (arr.join("") === word);
            return arr.join("");
        }
    </script>
