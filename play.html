        /**
 * Debug: Manual poll trigger
 */
        async function debugPoll() {
            const bee = document.getElementById('debugPollBtn');
            
            // Animate bee (spin while polling)
            bee.style.transform = 'rotate(360deg)';
            bee.style.transition = 'transform 0.5s';
            
            try {
                if (!multiplayerCode) {
                    console.log('[DEBUG] No multiplayer game active');
                    alert('Not in a multiplayer game');
                    return;
                }
                
                console.log('[DEBUG] Polling game:', multiplayerCode);
                
                const response = await fetch(`${API_URL}/api/poll-game/${multiplayerCode}`, {
                    headers: { 
                        'Authorization': `Bearer ${authToken}` 
                    }
                });
                
                const data = await response.json();
                
                console.log('[DEBUG] Poll result:', data);
                console.log('[DEBUG] Current word index:', currentWordIndex);
                console.log('[DEBUG] Server current index:', data.currentIndex);
                
                if (data.currentIndex > currentWordIndex) {
                    console.log('[DEBUG] ✅ Opponent advanced! Updating...');
                    // alert(`Opponent solved! Moving from word ${currentWordIndex} to ${data.currentIndex}`);
                    // Show opponent solved message
                    showOpponentSolvedMessage();
                    
                    // Move to the new word
                    jumpToWord(data.currentIndex);

                } else {
                    console.log('[DEBUG] ⏸️ No change detected');
                    alert('No changes - still in sync');
                }
                
            } catch (error) {
                console.error('[DEBUG] Poll error:', error);
                alert('Poll failed: ' + error.message);
            } finally {
                // Reset bee rotation
                setTimeout(() => {
                    bee.style.transform = 'rotate(0deg)';
                }, 100);
            }
        }

        /**
         * Show message when opponent solves
         */
        function showOpponentSolvedMessage() {
            const msg = document.createElement('div');
            msg.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
                color: white;
                padding: 30px 50px;
                border-radius: 16px;
                font-size: 28px;
                font-weight: bold;
                z-index: 9999;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                animation: slideIn 0.3s ease-out;
            `;
            msg.textContent = '👤 Opponent solved it!';
            document.body.appendChild(msg);
            
            // Remove after 2 seconds
            setTimeout(() => {
                msg.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => msg.remove(), 300);
            }, 2000);
        }

        /**
         * Jump to a specific word index (when opponent solves)
         */
        function jumpToWord(newIndex) {
            console.log(`[MULTIPLAYER] Jumping from word ${currentWordIndex} to ${newIndex}`);
            
            // Update to new word
            currentWordIndex = newIndex;
            currentWord = wordList[newIndex];
            currentGuess = '';
            guessesUsed = 0;
            remainingGuesses = maxGuesses;
            gameOver = false;
            
            // Reset UI
            createWordBoxes();
            updateGuessCount();
            resetKeyboard();
            hideClue();
            
            console.log(`[MULTIPLAYER] Now on word: ${currentWord}`);
        }

        /**
         * Reset keyboard colors
         */
        function resetKeyboard() {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('correct', 'present', 'used');
            });
        }

        /**
         * Share the current game
         */
        async function shareGameBusted() {
            const btn = document.getElementById('showClueBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            // Get fresh cache key from current game data
            const gameData = JSON.parse(localStorage.getItem('pendingGame'));
            const cacheKey = gameData?.cacheKey;
            
            if (!cacheKey) {
                alert('Error: No game loaded');
                btn.disabled = false;
                btn.textContent = 'Share Game';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/create-shared-game`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cacheKey: cacheKey,
                        clues: wordClues
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    alert('Failed to create shared game');
                    btn.disabled = false;
                    btn.textContent = 'Share Game';
                    return;
                }
                
                multiplayerCode = data.shareCode;
                isMultiplayerGame = true;
                
                // Save code
                localStorage.setItem('sharedGameCode', data.shareCode);
                
                // Show code to user
                showShareCodeModal(data.shareCode);
                
                // Start polling
                startPolling(data.shareCode);
                
                // Change button to show clue
                btn.textContent = '💡 Show Clue';
                btn.onclick = showClue;
                btn.disabled = false;
                
            } catch (error) {
                console.error('[MULTIPLAYER] Share error:', error);
                alert('Failed to create shared game');
                btn.disabled = false;
                btn.textContent = '📤 Share Game';
            }
        }

        /**
         * Copy share code to clipboard
         */
        function copyShareCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                // Fallback
                prompt('Copy this code:', code);
            });
        }

        /**
         * Start polling for game state changes
         */
        function startPolling(code) {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
            
            console.log('[MULTIPLAYER] Starting polling for game:', code);
            
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_URL}/api/poll-game/${code}`, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Check if opponent advanced
                        if (data.currentIndex > currentWordIndex) {
                            console.log('[MULTIPLAYER] Opponent advanced! Moving to next word...');
                            showOpponentSolved();
                        }
                        
                        // Check if game completed
                        if (data.status === 'completed' && !gameOver) {
                            console.log('[MULTIPLAYER] Game completed by opponent');
                            showOpponentWon();
                        }
                    }
                } catch (error) {
                    console.error('[MULTIPLAYER] Poll error:', error);
                }
            }, 2000); // Poll every 2 seconds
        }

        /**
         * Stop polling
         */
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
                console.log('[MULTIPLAYER] Stopped polling');
            }
        }

        async function startGame(gameData) {
            console.log('=== START GAME ===', gameData.words);
            
            clueViewCount = 0;  // ← ADD THIS
            currentGameData = gameData;
            gameResults = [];
            wordList = gameData.words;
            currentWordIndex = 0;
            selectedThemeWord = gameData.theme;
            currentWord = wordList[currentWordIndex];
            maxGuesses = gameData.guesses || 8;
            remainingGuesses = maxGuesses;
            currentLanguage = gameData.language || 'en';
            winMessage = gameData.winMessage || 'Correct!';
            loseMessage = gameData.loseMessage || 'Not quite! The word was';
            currentCacheKey = gameData.cacheKey || null;

            wordStartTime = Date.now();
            letterSwapCount = 0;
            wordClues = [];
            console.log('Language:', currentLanguage);
            
            document.getElementById('selectedTheme').textContent = `${selectedThemeWord} (${currentWordIndex + 1}/${wordList.length})`;
            
            createKeyboard(currentLanguage);
            console.log('createKeyboard ok');
            
            // ADD WORD POOL VISUALIZATION
            const gameScreen = document.getElementById('gameScreen');
            const oldViz = document.getElementById('wordPoolContainer');
            if (oldViz) oldViz.remove();

            const visualization = createWordPoolCanvas();
            const themeElement = document.querySelector('.theme-display');
            themeElement.parentNode.insertBefore(visualization, themeElement.nextSibling);

            // Draw visualization
            if (gameData.wordPoolInfo) {
                drawWordPoolVisualization(
                    gameData.wordPoolInfo.totalWords,
                    gameData.wordPoolInfo.selectedIndices
                );
            }
            try {
                await generateAllClues();
            } catch (error) {
                console.error('ERROR generating clues:', error);
                alert('Clue generation failed: ' + error.message);
                wordClues = []; // Continue without clues
            }

            console.log('createWordBoxes');
            createWordBoxes();
            console.log('updateGuessCount');
            updateGuessCount();
            
            if (wordClues.length > 0) {
                showClueAuto(20000);
            }
        }

        function shareResults() {
            const totalWords = gameResults.length;
            const wordsWon = gameResults.filter(r => r.won).length;
            const successRate = Math.round((wordsWon/totalWords)*100);
            
            // Create emoji grid (like Wordle)
            let shareText = `🐝 Wizbee - ${selectedThemeWord}\n`;
            shareText += `${wordsWon}/${totalWords} words (${successRate}%)\n\n`;
            
            gameResults.forEach((result, index) => {
                const icon = result.won ? '✅' : '❌';
                shareText += `${icon} ${result.word}: ${result.guesses} guesses in ${result.timeSeconds}s\n`;
            });
            
            shareText += `\nPlay at: https://wizbee.app`;
            
            // Copy to clipboard
            navigator.clipboard.writeText(shareText).then(() => {
                alert('Results copied to clipboard! 📋');
            }).catch(err => {
                console.error('Failed to copy:', err);
                // Fallback - show text in alert
                alert('Copy this:\n\n' + shareText);
            });
        }

        function updatePreviousGuesses() {
            const container = document.getElementById('previousGuesses');
            container.innerHTML = ''; // Clear existing
            
            guessHistory.forEach(guess => {
                showGuessFeedback(guess);
            });
        }

        function showGuessFeedback(guess) {
            const container = document.getElementById('previousGuesses');
            const guessDiv = document.createElement('div');
            guessDiv.className = 'previous-guess';

            const wordCopy = currentWord.split('');
            const guessCopy = guess.split('');
            const feedback = new Array(guess.length).fill('absent');

            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === currentWord[i]) {
                    feedback[i] = 'correct';
                    wordCopy[i] = null;
                    guessCopy[i] = null;
                }
            }

            for (let i = 0; i < guess.length; i++) {
                if (guessCopy[i] !== null) {
                    const index = wordCopy.indexOf(guessCopy[i]);
                    if (index !== -1) {
                        feedback[i] = 'present';
                        wordCopy[index] = null;
                    }
                }
            }

            let fontSizeClass = '';
            if (currentWord.length > 9) fontSizeClass = 'tiny-font';
            else if (currentWord.length > 6) fontSizeClass = 'small-font';

            for (let i = 0; i < guess.length; i++) {
            const box = document.createElement('div');
            box.className = `letter-box ${feedback[i]} ${fontSizeClass}`;
            box.textContent = guess[i];
            guessDiv.appendChild(box);
            }

            container.appendChild(guessDiv);
    }

        function getFeedbackForGuess(guess) {
            const feedback = [];
            const wordArray = currentWord.split('');
            const guessArray = guess.split('');
            const usedIndices = new Set();

            // Mark correct positions
            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === wordArray[i]) {
                    feedback[i] = 'correct';
                    usedIndices.add(i);
                }
            }

            // Mark present letters
            for (let i = 0; i < guessArray.length; i++) {
                if (feedback[i] !== 'correct') {
                    let found = false;
                    for (let j = 0; j < wordArray.length; j++) {
                        if (!usedIndices.has(j) && guessArray[i] === wordArray[j]) {
                            feedback[i] = 'present';
                            usedIndices.add(j);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        feedback[i] = 'incorrect';
                    }
                }
            }

            return feedback;
        }

        function createWordPoolCanvas() {
            const container = document.createElement('div');
            container.id = 'wordPoolContainer';
            container.style.cssText = 'margin: 20px 0; text-align: center;';
            
            const canvas = document.createElement('canvas');
            canvas.id = 'wordPoolCanvas';
            canvas.width = 800;
            canvas.height = 60;
            canvas.style.cssText = 'max-width: 100%; height: auto; border-radius: 8px;';
            
            container.appendChild(canvas);
            return container;
        }

        function drawWordPoolVisualization(totalWords, selectedIndices) {
            const canvas = document.getElementById('wordPoolCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            // Draw gradient background (easy -> hard)
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#48bb78');
            gradient.addColorStop(0.5, '#ed8936');
            gradient.addColorStop(1, '#f56565');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 20, width, 20);
            
            // Draw labels
            ctx.fillStyle = '#718096';
            ctx.font = '12px Arial';
            ctx.fillText('Easy', 10, 15);
            ctx.fillText('Hard', width - 35, 15);
            
            // Draw selected word markers
            if (selectedIndices && selectedIndices.length > 0) {
                selectedIndices.forEach(index => {
                    const x = (index / totalWords) * width;
                    
                    ctx.fillStyle = '#2d3748';
                    ctx.beginPath();
                    ctx.arc(x, 30, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }
        }

        function submitGuess() {
            if (currentGuess.length !== currentWord.length) return;
            if (gameOver) return;

            const guess = currentGuess.toUpperCase();
            guessHistory.push(guess);

            updatePreviousGuesses();
            
            const feedback = [];
            const wordArray = currentWord.split('');
            const guessArray = guess.split('');
            const usedIndices = new Set();

            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === wordArray[i]) {
                    feedback[i] = 'correct';
                    usedIndices.add(i);
                }
            }

            for (let i = 0; i < guessArray.length; i++) {
                if (feedback[i] !== 'correct') {
                    let found = false;
                    for (let j = 0; j < wordArray.length; j++) {
                        if (!usedIndices.has(j) && guessArray[i] === wordArray[j]) {
                            feedback[i] = 'present';
                            usedIndices.add(j);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        feedback[i] = 'incorrect';
                    }
                }
            }

            updateKeyboard(guess, feedback);

            remainingGuesses--;
            updateGuessCount();

            if (guess === currentWord) {
                endGame(true);
            } else if (remainingGuesses === 0) {
                endGame(false);
            }

            if (guess != currentWord) {
                currentGuess = '';
                updateWordBoxes();
            }
            
        }

        function updateKeyboard(guess, feedback) {
            for (let i = 0; i < guess.length; i++) {
                const letter = guess[i];
                const keys = document.querySelectorAll('.key');

                keys.forEach(key => {
                    if (key.textContent === letter) {
                        if (feedback[i] === 'correct' && !key.classList.contains('correct')) {
                            key.classList.remove('present', 'used');
                            key.classList.add('correct');
                        } else if (feedback[i] === 'present' && !key.classList.contains('correct')) {
                            key.classList.remove('used');
                            key.classList.add('present');
                        } else if (feedback[i] === 'incorrect' && !key.classList.contains('correct') && !key.classList.contains('present')) {
                            key.classList.add('used');
                        }
                    }
                });
            }
        }

        function showGuessFeedback(guess) {
            const container = document.getElementById('previousGuesses');
            const guessDiv = document.createElement('div');
            guessDiv.className = 'previous-guess';
            
            const wordCopy = currentWord.split('');
            const guessCopy = guess.split('');
            const feedback = new Array(guess.length).fill('absent');
            
            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === currentWord[i]) {
                    feedback[i] = 'correct';
                    wordCopy[i] = null;
                    guessCopy[i] = null;
                }
            }
            
            for (let i = 0; i < guess.length; i++) {
                if (guessCopy[i] !== null) {
                    const index = wordCopy.indexOf(guessCopy[i]);
                    if (index !== -1) {
                        feedback[i] = 'present';
                        wordCopy[index] = null;
                    }
                }
            }
            
            let fontSizeClass = '';
            if (currentWord.length > 9) fontSizeClass = 'tiny-font';
            else if (currentWord.length > 6) fontSizeClass = 'small-font';
            
            for (let i = 0; i < guess.length; i++) {
                const box = document.createElement('div');
                box.className = `letter-box ${feedback[i]} ${fontSizeClass}`;
                box.textContent = guess[i];
                guessDiv.appendChild(box);
            }
            
            container.appendChild(guessDiv);
        }

        }

        function hideClue() {
            document.getElementById('clueDisplay').classList.add('hidden');
            if (currentClueTimeout) {
                clearTimeout(currentClueTimeout);
                currentClueTimeout = null;
            }
        }

        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('errorMessage').innerHTML = `${message}. <a href="browse.html">Return to browse</a>`;
        }

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (gameOver) return;
            
            if (e.key === 'Enter') {
                submitGuess();
            } else if (e.key === 'Backspace') {
                handleKeyPress('BACKSPACE');
            } else if (/^[a-zA-Z]$/.test(e.key)) {
                handleKeyPress(e.key.toUpperCase());
            }
        });

        // hint button support
        function scramble(word) {
            let arr = word.split("");
            do {
                for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            } while (arr.join("") === word);
            return arr.join("");
        }
    </script>
</body>
</html>
