<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Wizbee</title>

    
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <img 
                    id="debugPollBtn" 
                    src="bee4.png" 
                    alt="Poll" 
                    style="height: 48px; vertical-align: middle;"
                    onmouseover="this.style.transform='scale(1.1)'"
                    onmouseout="this.style.transform='scale(1)'"
                >

                <span style="color: #f59e0b;">Wizbee</span>
            </a>
        </h1>

        <!-- Loading Message -->
        <div id="loadingMessage" style="text-align: center; padding: 60px; color: #718096;">
            <img src="bee4.png" style="height: 60px;"><br>
            Loading game...
        </div>

        <!-- Game Board -->
        <div id="gameScreen" class="game-screen">
            <div class="theme-display">Theme: <span id="selectedTheme"></span></div>
            
            <!-- CLUE DISPLAY -->
            <div id="clueDisplay" class="clue-display hidden" style="
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px;
                border-radius: 12px;
                margin: 20px 0;
                text-align: center;
                font-size: 18px;
                font-weight: 600;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            ">
                <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">💡 Clue</div>
                <div id="clueText"></div>
            </div>
            
            <div id="wordBoxes" class="word-boxes"></div>
            <div class="guesses-remaining">Guesses remaining: <span id="guessesRemaining"></span></div>
            <div id="keyboard" class="keyboard" hidden></div>

            <input 
            type="text" 
            id="guessInput" 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            style="
                position: absolute;
                left: -9999px;
                width: 1px;
                height: 1px;
                opacity: 0;
            "
            />

            <div class="guess-input-container">
                <button id="submitGuess" class="submit-guess" onclick="submitGuess()">Submit Word</button>
                <button id="showClueBtn" class="hint-btn" onclick="showClue()">💡 Show Clue</button>
                <button id="giveUpBtn" class="give-up-btn" onclick="giveUp()">Give Up</button>
            </div>

            <div id="hintDisplay" class="hint-display hidden"></div>
            <div id="previousGuesses" class="previous-guesses"></div>
            <div id="gameMessage" class="message"></div>
            <button id="resetButton" class="play-again hidden" onclick="nextWord()">Next Word →</button>
            <button id="backButton" class="play-again hidden" onclick="returnToBrowse()" style="background: #e2e8f0; color: #2d3748;">← Exit Game</button>
        </div>

        <!-- Game Summary Modal -->
        <div id="summaryOverlay" class="summary-overlay hidden">
            <div class="summary-modal">
                <h2>🎮 Game Complete!</h2>
                <div id="summaryContent"></div>
                <button onclick="shareResults()" class="play-again" style="background: #22c55e; margin-top: 10px;">
                    Share Results
                </button>

                <button onclick="closeSummary()" class="play-again" style="margin-top: 20px;">
                    Back to Browse
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden" style="text-align: center; padding: 60px; color: #e53e3e;">
            Failed to load game. <a href="browse.html">Return to browse</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.wizbee.app';
        let authToken = null;
        
        // Game state
        let wordList = [];
        let currentWordIndex = 0;
        let currentWord = '';
        let currentGuess = '';
        let remainingGuesses = 0;
        let maxGuesses = 8;
        let guessHistory = [];
        let gameOver = false;
        let selectedThemeWord = '';
        let currentLanguage = 'en';
        let winMessage = 'Correct!';
        let loseMessage = 'Not quite! The word was';
        let wordClues = [];
        let currentClueTimeout = null;
        let hintsUsed = 0;
        let clueViewCount = 0;
        let wordStartTime = null;
        let letterSwapCount = 0;
        let gameResults = [];
        let currentGameData = null;

        let currentThemeId = null;
	    let currentCacheKey = null;
        // ============================================================================
        // MULTIPLAYER FUNCTIONS
        // ============================================================================

        let isMultiplayerGame = false;
        let multiplayerCode = null;
        let pollInterval = null;
        
        // Prevent any navigation
        /*
        window.addEventListener('beforeunload', function(e) {
            console.log('[NAVIGATION] Page trying to unload!');
            console.trace(); // Shows what triggered it
            e.preventDefault();
            e.returnValue = '';
            return 'Page is trying to leave - are you sure?';
        });
        */

        // ============================================================================
// SOCKET.IO CONNECTION
// ============================================================================

let socket = null;

/**
 * Initialize Socket.IO connection for multiplayer
 */
        function initializeSocket() {
            if (!multiplayerCode) {
                console.log('[SOCKET] No multiplayer game - skipping socket connection');
                return;
            }
            
            console.log('[SOCKET] Connecting to server...');
            // DEBUG: Check if authToken is available
            console.log('[SOCKET] authToken exists:', !!authToken);
            console.log('[SOCKET] authToken value:', authToken ? authToken.substring(0, 20) + '...' : 'NULL');
    
            
            socket = io('https://api.wizbee.app', {
                auth: {
                    token: authToken  // Send JWT token for authentication
                },
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });

            socket.on('game_completed', (data) => {
                console.log('[SOCKET] 🏁 Game completed!');
                
                // Show completion message
                const messageDiv = document.getElementById('gameMessage');
                messageDiv.textContent = '🏁 Game Complete! All words finished.';
                messageDiv.className = 'message win';
                
                // Hide game controls
                document.getElementById('submitGuess').classList.add('hidden');
                document.getElementById('showClueBtn').classList.add('hidden');
                document.getElementById('giveUpBtn').classList.add('hidden');
                
                // Show summary button
                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🎉 View Summary';
                resetBtn.classList.remove('hidden');
                resetBtn.disabled = false;
                resetBtn.onclick = showGameSummary;
            });

            socket.on('opponent_advanced', async (data) => {
                console.log('[SOCKET] 🎯 Opponent advanced to index:', data.newIndex);
                console.log('[SOCKET] Solver:', data.solver);
                
                const currentUserEmail = localStorage.getItem('userEmail');
                
                if (data.solver === currentUserEmail) {
                    console.log('[SOCKET] Ignoring - we solved it ourselves');
                    return;
                }
                
                // Only react if we're behind
                if (data.newIndex > currentWordIndex) {
                    // Record opponent's solve
                    gameResults.push({
                        word: wordList[currentWordIndex],
                        won: false,
                        solvedByOpponent: true,
                        guesses: 0,
                        timeSeconds: 0,
                        cluesViewed: 0
                    });

                    // ALWAYS show animation first (even if it's the last word)
                    await animateOpponentSolution();
                    showOpponentSolvedMessage();
                    await delay(2000);
                    
                    // NOW check if game is complete
                    if (data.newIndex >= wordList.length) {
                        console.log('[SOCKET] Last word solved - game complete!');
                        
                        // Show completion message
                        const messageDiv = document.getElementById('gameMessage');
                        messageDiv.textContent = '🏁 Game Complete! All words finished.';
                        messageDiv.className = 'message win';
                        
                        // Hide game controls
                        document.getElementById('submitGuess').classList.add('hidden');
                        document.getElementById('showClueBtn').classList.add('hidden');
                        document.getElementById('giveUpBtn').classList.add('hidden');
                        
                        // Show summary button
                        const resetBtn = document.getElementById('resetButton');
                        resetBtn.textContent = '🎉 View Summary';
                        resetBtn.classList.remove('hidden');
                        resetBtn.disabled = false;
                        resetBtn.onclick = showGameSummary;
                        
                        // Don't call jumpToWord - we're done
                        return;
                    }
                    
                    // Not last word - jump to next word normally
                    jumpToWord(data.newIndex);
                    
                    // Re-enable controls
                    document.getElementById('submitGuess').classList.remove('hidden');
                    document.getElementById('showClueBtn').classList.remove('hidden');
                    document.getElementById('giveUpBtn').classList.remove('hidden');
                    
                    const resetBtn = document.getElementById('resetButton');
                    if (data.newIndex < wordList.length - 1) {
                        resetBtn.classList.add('hidden');
                    }
                    
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Next Word →';
                    
                    const msg = document.getElementById('gameMessage');
                    if (msg) {
                        msg.textContent = '';
                        msg.className = 'message';
                    }
                    
                    gameOver = false;
                }
            });
            
            socket.on('opponent_advancedDepreciated', async (data) => {
                console.log('[SOCKET] 🎯 Opponent advanced to index:', data.newIndex);
                console.log('[SOCKET] Solver:', data.solver);

                const currentUserEmail = localStorage.getItem('userEmail');
    
                // ============================================================================
                // IGNORE IF WE ARE THE SOLVER (ADD THIS CHECK)
                // ============================================================================
                
                if (data.solver === currentUserEmail) {
                    console.log('[SOCKET] Ignoring - we solved it ourselves');
                    return;
                }
                
                // Only react if we're behind
                if (data.newIndex > currentWordIndex) {
                    // Record opponent's solve
                    gameResults.push({
                        word: wordList[currentWordIndex],
                        won: false,
                        solvedByOpponent: true,
                        guesses: 0,
                        timeSeconds: 0,
                        cluesViewed: 0
                    });

                    // Animate opponent's solution
                    await animateOpponentSolution();
                    
                    // Show message
                    showOpponentSolvedMessage();
                    
                    // Wait 2 seconds
                    await delay(2000);
                    
                    // Jump to next word
                    jumpToWord(data.newIndex);

                    // ============================================================================
                    // RE-ENABLE GAME CONTROLS (ADD THIS SECTION)
                    // ============================================================================
                    
                    // Show game buttons
                    document.getElementById('submitGuess').classList.remove('hidden');
                    document.getElementById('showClueBtn').classList.remove('hidden');
                    document.getElementById('giveUpBtn').classList.remove('hidden');
                    
                    // Hide/reset next button
                    if (newIndex === wordList.length - 1) {
                        const resetBtn = document.getElementById('resetButton');
                        resetBtn.disabled = true;
                        resetBtn.textContent = '🏁 No More Words';
                    }
                    
                    // Clear message
                    const msg = document.getElementById('gameMessage');
                    if (msg) {
                        msg.textContent = '';
                        msg.className = 'message';
                    }
                    
                    // Clear any waiting state
                    gameOver = false;
                }
            });
            
            socket.on('player_joined', (data) => {
                console.log('[SOCKET] 👋 Another player joined:', data.playerEmail || 'unknown');
                // Could show a message here if you want
            });
            
            socket.on('game_completed', (data) => {
                console.log('[SOCKET] 🏁 Game completed by:', data.winner);
                // Handle game completion if needed
            });
            
            socket.on('error', (data) => {
                console.error('[SOCKET] ❌ Server error:', data.message);
                alert(`Game error: ${data.message}`);
            });
            
            socket.on('connect_error', (error) => {
                console.error('[SOCKET] ❌ Connection error:', error.message);
                
                if (error.message === 'Authentication required' || error.message.includes('Invalid')) {
                    console.error('[SOCKET] Authentication failed - token may be expired');
                    alert('Session expired. Please refresh the page and log in again.');
                } else {
                    console.log('[SOCKET] Connection failed - use bee button for manual polling');
                }
            });
            
            socket.on('disconnect', (reason) => {
                console.log('[SOCKET] ⚠️ Disconnected:', reason);
                console.log('[SOCKET] Use bee button as fallback or wait for reconnection');
            });

            socket.on('player_skipped', (data) => {
                console.log('[SOCKET] 👋 Opponent skipped word:', data.wordIndex);
                console.log('[SOCKET] Skipper:', data.skipper);
                
                // Optional: Show a brief message
                const msg = document.createElement('div');
                msg.style.cssText = `
                    position: fixed;
                    top: 20%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #f59e0b;
                    color: white;
                    padding: 15px 30px;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 9999;
                `;
                msg.textContent = '⏭️ Opponent skipped this word';
                document.body.appendChild(msg);
                
                setTimeout(() => msg.remove(), 2000);
            });
            
            socket.on('skip_requested', (data) => {
                console.log('[SOCKET] 👋 Opponent requested skip for word:', data.word);
                console.log('[SOCKET] Requester:', data.requester);
                
                // Get current user email
                const currentUserEmail = localStorage.getItem('userEmail');
                
                // Don't show modal to the person who requested skip
                if (data.requester === currentUserEmail) {
                    console.log('[SOCKET] Ignoring - we requested the skip');
                    return;
                }
                
                // Show modal asking if we want to skip too
                showSkipRequestModal(data.requester, data.word);
            });
        

            socket.on('skip_declined', (data) => {
                console.log('[SOCKET] 🚫 Skip declined by:', data.decliner);
                
                // Get current user email
                const currentUserEmail = localStorage.getItem('userEmail');
                
                // Only show to the person who requested skip
                if (data.decliner === currentUserEmail) {
                    console.log('[SOCKET] Ignoring - we declined');
                    return;
                }
    
                // Re-enable next button and show message
                const resetBtn = document.getElementById('resetButton');
                const msg = document.getElementById('gameMessage');
                
                resetBtn.disabled = false;
                resetBtn.textContent = 'Next Word →';
                
                if (msg) {
                    msg.textContent = '💪 Opponent wants to keep trying!';
                    msg.className = 'message';
                }
                
                // Show temporary notification
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #f59e0b;
                    color: white;
                    padding: 20px 40px;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 9999;
                `;
                notification.textContent = 'Opponent is still trying to solve it!';
                document.body.appendChild(notification);
                setTimeout(() => notification.remove(), 3000);
            });

            socket.on('both_skipped', async (data) => {
                console.log('[SOCKET] ⏭️ Both players skipped! Advancing to:', data.newIndex);
                
                // Record as skipped for both
                gameResults.push({
                    word: wordList[currentWordIndex],
                    won: false,
                    bothSkipped: true,
                    guesses: 0,
                    timeSeconds: 0,
                    cluesViewed: 0
                });
                
                // Show message
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #667eea;
                    color: white;
                    padding: 20px 40px;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 9999;
                `;
                notification.textContent = '⏭️ Both skipped - moving to next word';
                document.body.appendChild(notification);
                
                await delay(2000);
                notification.remove();
                
                // Jump to next word
                jumpToWord(data.newIndex);
                // ============================================================================
                // RE-ENABLE GAME CONTROLS (ADD THIS SECTION)
                // ============================================================================
                
                // Show game buttons
                document.getElementById('submitGuess').classList.remove('hidden');
                document.getElementById('showClueBtn').classList.remove('hidden');
                document.getElementById('giveUpBtn').classList.remove('hidden');
                
                // Hide/reset next button
                const resetBtn = document.getElementById('resetButton');
                resetBtn.classList.add('hidden');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Next Word →';
                
                // Clear message
                const msg = document.getElementById('gameMessage');
                if (msg) {
                    msg.textContent = '';
                    msg.className = 'message';
                }
            });

            socket.on('connect', () => {
                console.log('[SOCKET] ✅ Connected:', socket.id);
                
                // Join the game room
                socket.emit('join_game', multiplayerCode);
                console.log('[SOCKET] Requesting to join room:', multiplayerCode);
            });
        }


        function initMultiplayer() {
            multiplayerCode = localStorage.getItem('sharedGameCode');
            isMultiplayerGame = !!multiplayerCode;
            
            if (isMultiplayerGame) {
                console.log('[MULTIPLAYER] Joined game:', multiplayerCode);
                
                //startPolling(multiplayerCode);
                // Button stays as "Show Clue" since clues already exist
            }
            // Don't change button here - let generateAllClues() handle it
        }

        /**
         * Simple delay helper
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /**
         * Animate the opponent's answer letter-by-letter
         */
        async function animateOpponentSolution() {
            const word = wordList[currentWordIndex];
            const boxes = document.querySelectorAll('.letter-box');
            
            console.log('[ANIMATION] Showing opponent solution:', word);
            
            // Clear current boxes
            boxes.forEach(box => {
                box.textContent = '';
                box.classList.remove('correct', 'present', 'absent', 'active-input');
            });
            
            // Reveal each letter with delay
            for (let i = 0; i < word.length; i++) {
                const box = boxes[i];
                box.textContent = word[i];
                box.classList.add('correct');
                
                // Flash effect
                box.style.animation = 'none';
                setTimeout(() => {
                    box.style.animation = 'pop 0.3s ease-in-out';
                }, 10);
                
                await delay(150); // 150ms per letter
            }
            
            // Flash all boxes green
            await delay(300);
            boxes.forEach((box, i) => {
                if (i < word.length) {
                    box.style.animation = 'pulse 0.5s ease-in-out';
                }
            });
            
            await delay(800);
        }
       

       /**
         * Debug: Manual poll trigger
         */
        async function debugPoll() {
            console.log('[DEBUG POLL START] authToken:', localStorage.getItem('authToken'));
            console.log('[DEBUG POLL START] authToken global var:', authToken);
            const bee = document.getElementById('debugPollBtn');
            
            // Animate bee (spin while polling)
            bee.style.transform = 'rotate(360deg)';
            bee.style.transition = 'transform 0.5s';

            
            try {
                if (!multiplayerCode) {
                    console.log('[DEBUG] No multiplayer game active');
                    
                    return;
                }
                
                console.log('[DEBUG] Polling game:', multiplayerCode);
                
                const response = await fetch(`${API_URL}/api/poll-game/${multiplayerCode}`, {
                    headers: { 
                        'Authorization': `Bearer ${authToken}` 
                    }
                });
                
                const data = await response.json();
                
                console.log('[DEBUG] Poll result:', data);
                console.log('[DEBUG] Current word index:', currentWordIndex);
                console.log('[DEBUG] Server current index:', data.currentIndex);
                
                if (data.currentIndex > currentWordIndex) {
                        console.log('[DEBUG] ✅ Opponent advanced!');

                    gameResults.push({
                        word: wordList[currentWordIndex],
                        won: false,
                        solvedByOpponent: true,
                        guesses: 0,
                        timeSeconds: 0,
                        cluesViewed: 0
                    });
    
                    // Show opponent's answer with animation
                    await animateOpponentSolution();
                    
                    // Show message
                    showOpponentSolvedMessage();
                    
                    // Wait 2 seconds
                    await delay(2000);
                    
                    // Move to next word
                    jumpToWord(data.currentIndex);
                } else {
                    console.log('[DEBUG] ⏸️ No change detected');
                }
                
            } catch (error) {
                console.error('[DEBUG] Poll error:', error);
            } finally {
                // Reset bee rotation
                console.log('[DEBUG POLL END] authToken:', localStorage.getItem('authToken'));
                setTimeout(() => {
                    bee.style.transform = 'rotate(0deg)';
                }, 100);
            }
        }

        /**
         * Show message when opponent solves
         */
        function showOpponentSolvedMessage() {
            const msg = document.createElement('div');
            msg.style.cssText = `
                position: fixed;
                top: 20%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
                color: white;
                padding: 30px 50px;
                border-radius: 16px;
                font-size: 28px;
                font-weight: bold;
                z-index: 9999;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                animation: slideIn 0.3s ease-out;
            `;
            msg.textContent = '👤 Opponent solved it!';
            document.body.appendChild(msg);
            
            // Remove after 2 seconds
            setTimeout(() => {
                msg.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => msg.remove(), 300);
            }, 2000);
        }

        function jumpToWord(newIndex) {
            console.log(`[MULTIPLAYER] Jumping from word ${currentWordIndex} to ${newIndex}`);

            hideClue();
            
            // Check if game is complete
            if (newIndex >= wordList.length) {
                console.log('[MULTIPLAYER] Game complete! No more words.');
                
                // Hide game controls
                document.getElementById('submitGuess').classList.add('hidden');
                document.getElementById('showClueBtn').classList.add('hidden');
                document.getElementById('giveUpBtn').classList.add('hidden');
                
                // Show summary button
                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🎉 View Summary';
                resetBtn.classList.remove('hidden');
                resetBtn.disabled = false;
                resetBtn.onclick = showGameSummary;
                
                // Show message
                const messageDiv = document.getElementById('gameMessage');
                messageDiv.textContent = '🏁 Game Complete!';
                messageDiv.className = 'message win';
                
                return;
            }
            
            // Update to new word
            currentWordIndex = newIndex;
            currentWord = wordList[newIndex];
            currentGuess = '';
            guessHistory = [];
            guessesUsed = 0;
            remainingGuesses = maxGuesses;
            gameOver = false;
            
            // Reset UI
            createWordBoxes();
            updateGuessCount();
            resetKeyboard();
            hideClue();
            
            // Clear previous guesses and messages
            document.getElementById('previousGuesses').innerHTML = '';
            document.getElementById('gameMessage').textContent = '';

            document.getElementById('selectedTheme').textContent = `${selectedThemeWord} (${currentWordIndex + 1}/${wordList.length})`;
            
            // ============================================================================
            // CHECK IF THIS IS THE LAST WORD - SHOW "NO MORE WORDS" BUTTON
            // ============================================================================
            
            if (newIndex >= wordList.length - 1) {
                // This is the LAST word - show disabled "No More Words" button
                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🏁 No More Words';
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.6';
                resetBtn.style.cursor = 'not-allowed';
                resetBtn.classList.remove('hidden');
                
                console.log('[GAME] Last word - showing "No More Words" button');
            }

            if (wordClues.length > newIndex) {
                 showClueAuto(20000);
            }
            
            console.log(`[MULTIPLAYER] Now on word: ${currentWord}`);
        }

        /**
         * Jump to a specific word index (when opponent solves)
         */
        function jumpToWordDepreciated(newIndex) {
            console.log(`[MULTIPLAYER] Jumping from word ${currentWordIndex} to ${newIndex}`);

            // Check if this is the LAST word (game complete)
            if (currentWordIndex >= wordList.length) {
                console.log('[MULTIPLAYER] Last word reached - enabling summary view');
                
                // Hide game controls
                document.getElementById('submitGuess').classList.add('hidden');
                document.getElementById('showClueBtn').classList.add('hidden');
                document.getElementById('giveUpBtn').classList.add('hidden');
                
                // Show summary button
                const resetBtn = document.getElementById('resetButton');
                resetBtn.textContent = '🎉 View Summary';
                resetBtn.classList.remove('hidden');
                resetBtn.disabled = false;
                resetBtn.onclick = showGameSummary;
                
                // Show message
                const messageDiv = document.getElementById('gameMessage');
                messageDiv.textContent = '🏁 Game Complete! Your opponent finished the last word.';
                messageDiv.className = 'message';

                return; // Exit early - don't try to load non-existent word
            }

            // Update to new word
            currentWordIndex = newIndex;
            currentWord = wordList[newIndex];
            currentGuess = '';
            guessesUsed = 0;
            guessHistory = [];
            remainingGuesses = maxGuesses;
            gameOver = false;
            
            // Reset UI

        function getFeedbackForGuess(guess) {
            const feedback = [];
            const wordArray = currentWord.split('');
            const guessArray = guess.split('');
            const usedIndices = new Set();

            // Mark correct positions
            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === wordArray[i]) {
                    feedback[i] = 'correct';
                    usedIndices.add(i);
                }
            }

            // Mark present letters
            for (let i = 0; i < guessArray.length; i++) {
                if (feedback[i] !== 'correct') {
                    let found = false;
                    for (let j = 0; j < wordArray.length; j++) {
                        if (!usedIndices.has(j) && guessArray[i] === wordArray[j]) {
                            feedback[i] = 'present';
                            usedIndices.add(j);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        feedback[i] = 'incorrect';
                    }
                }
            }

            return feedback;
        }

        function drawWordPoolVisualization(totalWords, selectedIndices) {
            const canvas = document.getElementById('wordPoolCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            // Draw gradient background (easy -> hard)
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#48bb78');
            gradient.addColorStop(0.5, '#ed8936');
            gradient.addColorStop(1, '#f56565');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 20, width, 20);
            
            // Draw labels
            ctx.fillStyle = '#718096';
            ctx.font = '12px Arial';
            ctx.fillText('Easy', 10, 15);
            ctx.fillText('Hard', width - 35, 15);
            
            // Draw selected word markers
            if (selectedIndices && selectedIndices.length > 0) {
                selectedIndices.forEach(index => {
                    const x = (index / totalWords) * width;
                    
                    ctx.fillStyle = '#2d3748';
                    ctx.beginPath();
                    ctx.arc(x, 30, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            }
        }

            if (gameOver) return;

                return;
            }

                updateWordBoxes();
            }

        function submitGuess() {
            if (currentGuess.length !== currentWord.length) return;
            if (gameOver) return;

            const guess = currentGuess.toUpperCase();
            guessHistory.push(guess);

            updatePreviousGuesses();
            
            const feedback = [];
            const wordArray = currentWord.split('');
            const guessArray = guess.split('');
            const usedIndices = new Set();

            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === wordArray[i]) {
                    feedback[i] = 'correct';
                    usedIndices.add(i);
                }
            }

            for (let i = 0; i < guessArray.length; i++) {
                if (feedback[i] !== 'correct') {
                    let found = false;
                    for (let j = 0; j < wordArray.length; j++) {
                        if (!usedIndices.has(j) && guessArray[i] === wordArray[j]) {
                            feedback[i] = 'present';
                            usedIndices.add(j);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        feedback[i] = 'incorrect';
                    }
                }
            }

            updateKeyboard(guess, feedback);

            remainingGuesses--;
            updateGuessCount();

            if (guess === currentWord) {
                endGame(true);
            } else if (remainingGuesses === 0) {
                endGame(false);
            }

            if (guess != currentWord) {
                currentGuess = '';
                updateWordBoxes();
            }
            
        }

        function updateKeyboard(guess, feedback) {
            for (let i = 0; i < guess.length; i++) {
                const letter = guess[i];
                const keys = document.querySelectorAll('.key');

                keys.forEach(key => {
                    if (key.textContent === letter) {
                        if (feedback[i] === 'correct' && !key.classList.contains('correct')) {
                            key.classList.remove('present', 'used');
                            key.classList.add('correct');
                        } else if (feedback[i] === 'present' && !key.classList.contains('correct')) {
                            key.classList.remove('used');
                            key.classList.add('present');
                        } else if (feedback[i] === 'incorrect' && !key.classList.contains('correct') && !key.classList.contains('present')) {
                            key.classList.add('used');
                        }
                    }
                });
            }
        }

            for (let i = 0; i < guess.length; i++) {

                    feedback[i] = 'correct';
                    wordCopy[i] = null;
                    guessCopy[i] = null;
                }
            }
            
            for (let i = 0; i < guess.length; i++) {

                    const index = wordCopy.indexOf(guessCopy[i]);
                    if (index !== -1) {

                const data = await response.json();
                
                if (data.success && data.advanced) {

                    // AUTO-JUMP to next word after broadcasting
                    const newIndex = currentWordIndex + 1;

                resetBtn.textContent = '🏁 No More Words';
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.6';
                resetBtn.style.cursor = 'not-allowed';
                resetBtn.classList.remove('hidden');
            }

            // Wire up hidden input for mobile keyboard
            const guessInput = document.getElementById('guessInput');
            if (guessInput) {
                guessInput.value = '';
                guessInput.maxLength = currentWord.length;
                guessInput.focus();
            }

            if (wordClues.length > currentWordIndex) {
                showClueAuto(20000);
            }
        }

        function nextWordDepreciated() {
            if (currentWordIndex >= wordList.length - 1) {
                // Game complete - show summary
                showGameSummary();
                return;
            }

            currentWordIndex++;
            currentWord = wordList[currentWordIndex];
            currentGuess = '';
            guessHistory = [];
            remainingGuesses = maxGuesses;
            gameOver = false;
            wordStartTime = Date.now();
            clueViewCount = 0;  // ← ADD THIS

            document.getElementById('selectedTheme').textContent = `${selectedThemeWord} (${currentWordIndex + 1}/${wordList.length})`;
            document.getElementById('gameMessage').textContent = '';
            document.getElementById('previousGuesses').innerHTML = '';
            document.getElementById('resetButton').classList.add('hidden');
            document.getElementById('backButton').classList.add('hidden');
            document.getElementById('submitGuess').classList.remove('hidden');
            document.getElementById('showClueBtn').classList.remove('hidden');
            document.getElementById('giveUpBtn').classList.remove('hidden');

            document.querySelectorAll('.key').forEach(key => {
                key.classList.remove('correct', 'present', 'used');
            });

            createWordBoxes();
            updateGuessCount();

            if (wordClues.length > currentWordIndex) {
                showClueAuto(20000);
                // Wire up hidden input for mobile keyboard
                const guessInput = document.getElementById('guessInput');
                if (guessInput) {
                    guessInput.value = '';
                    guessInput.maxLength = currentWord.length;
                    
                    guessInput.addEventListener('input', (e) => {
                        currentGuess = e.target.value.toUpperCase();
                        e.target.value = currentGuess;
                        updateWordBoxes();
                    });
                    
                    guessInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            submitGuess();
                        }
                    });
                }
            }
        }

        /**
         * Notify other players that you skipped a word
         */
        async function skipMultiplayerWord() {
            if (!isMultiplayerGame || !multiplayerCode) return;
            
            try {
                console.log('[MULTIPLAYER] Skipping word:', currentWordIndex);
                
                const response = await fetch(`${API_URL}/api/skip-word`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        shareCode: multiplayerCode,
                        wordIndex: currentWordIndex
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('[MULTIPLAYER] ✅ Skip broadcast to opponents');
                }
                
            } catch (error) {
                console.error('[MULTIPLAYER] Skip error:', error);
            }
        }

        async function giveUp() {
    console.log('[GAME] Player gave up on word:', currentWord);
    
    // End game locally - show answer, mark as lost
    endGame(false);
    
    // If multiplayer, request skip from opponent
    if (isMultiplayerGame && multiplayerCode) {
        try {
            console.log('[MULTIPLAYER] Requesting skip from opponent');

            await delay(4000); // Small delay to ensure local endGame processes first
            
            const response = await fetch(`${API_URL}/api/request-skip`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    shareCode: multiplayerCode,
                    wordIndex: currentWordIndex,
                    word: currentWord
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                console.log('[MULTIPLAYER] Skip request sent');
                showWaitingForOpponent();
            }
            
        } catch (error) {
            console.error('[MULTIPLAYER] Skip request error:', error);
        }
    }
}

        /**
         * Show waiting state after requesting skip
         */
        function showWaitingForOpponent() {
            const resetBtn = document.getElementById('resetButton');
            const msg = document.getElementById('gameMessage');
            
            resetBtn.textContent = '⏳ Waiting for opponent...';
            resetBtn.disabled = true;
            resetBtn.classList.remove('hidden');
            
            if (msg) {
                msg.textContent = 'Waiting for opponent to decide...';
                msg.className = 'message';
            }
        }

        function giveUpDepreciated() {
            //if (confirm('Give up on this word?')) {
                //advanceMultiplayerGame();
                skipMultiplayerWord();
                endGame(false);
            //}
        }

        function returnToBrowse() {
            window.location.href = 'browse.html';
        }

        async function generateAllClues() {
            // Disable and show "thinking" on clue button
            const clueBtn = document.getElementById('showClueBtn');
            const originalText = clueBtn.textContent;
            clueBtn.disabled = true;
            clueBtn.textContent = '💭 Thinking...';
            clueBtn.style.background = '#cbd5e0';
            clueBtn.style.cursor = 'not-allowed';
            
            try {
                const response = await fetch(`${API_URL}/api/generate-clues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        words: wordList,
                        theme: selectedThemeWord,
                        language: currentLanguage,
                        difficulty: currentGameData.difficulty || 'medium' 
                    })
                });

                const data = await response.json();
                
                if (data.clues) {
                    wordClues = data.clues;
                    if (data.winMessage) winMessage = data.winMessage;
                    if (data.loseMessage) loseMessage = data.loseMessage;
                }
            } catch (error) {
                console.error('Error generating clues:', error);
            } finally {
                    // Re-enable button
                    clueBtn.disabled = false;
                    
                    // Check if this is a multiplayer game
                    const multiplayerCode = localStorage.getItem('sharedGameCode');
                    const isMultiplayerGame = !!multiplayerCode;

                    console.log('[CLUES] multiplayerCode:', multiplayerCode);
                    console.log('[CLUES] isMultiplayerGame:', isMultiplayerGame);
                    
                    if (isMultiplayerGame) {
                        // Already in multiplayer - show clue button
                        clueBtn.textContent = 'Show Clue';
                        clueBtn.onclick = showClue;
                    } else {
                        // Solo game - ALWAYS show share button
                        clueBtn.textContent = 'Share Game';
                        clueBtn.onclick = shareGame;
                    }
                    
                    clueBtn.style.background = '';
                    clueBtn.style.cursor = '';
                }
        }


        function showClue() {
            if (wordClues.length > currentWordIndex) {
                document.getElementById('clueText').textContent = wordClues[currentWordIndex];
                document.getElementById('clueDisplay').classList.remove('hidden');
                clueViewCount++;
            }
        }

        function showClueAuto(duration) {
            if (currentClueTimeout) {
                clearTimeout(currentClueTimeout);
            }

            showClue();

            currentClueTimeout = setTimeout(() => {
                hideClue();
            }, duration);
        }

        function hideClue() {
            document.getElementById('clueDisplay').classList.add('hidden');
            if (currentClueTimeout) {
                clearTimeout(currentClueTimeout);
                currentClueTimeout = null;
            }
        }

        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('errorMessage').innerHTML = `${message}. <a href="browse.html">Return to browse</a>`;
        }

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (gameOver) return;
            
            if (e.key === 'Enter') {
                submitGuess();
            } else if (e.key === 'Backspace') {
                handleKeyPress('BACKSPACE');
            } else if (/^\p{L}$/u.test(e.key)) {
                handleKeyPress(e.key.toUpperCase());
            }
        });

        // hint button support
        function scramble(word) {
            let arr = word.split("");
            do {
                for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            } while (arr.join("") === word);
            return arr.join("");
        }
    </script>
