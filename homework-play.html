<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homework - Wizbee</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .homework-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .player-name-display {
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Word Progress */
        .word-progress {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #48bb78;
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* Clue Display */
        .clue-section {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .clue-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clue-text {
            font-size: 20px;
            line-height: 1.5;
        }

        /* Word Boxes */
        .word-boxes {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 40px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .letter-box.filled {
            background: rgba(255, 255, 255, 0.9);
            color: #764ba2;
        }

        .letter-box.correct {
            background: #48bb78;
            color: white;
        }

        /* Input Section */
        .input-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
        }

        .guess-input {
            width: 100%;
            padding: 18px;
            font-size: 24px;
            text-align: center;
            border: none;
            border-radius: 12px;
            background: white;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .guess-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        .guess-input {
            -webkit-user-select: text;
            user-select: text;
            pointer-events: auto;
            position: relative;
            z-index: 10;
        }

        .guess-input::placeholder {
            color: #a0aec0;
            text-transform: none;
            letter-spacing: normal;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .give-up-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .give-up-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Feedback Messages */
        .feedback {
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .feedback.wrong {
            display: block;
            background: rgba(229, 62, 62, 0.3);
            border: 1px solid rgba(229, 62, 62, 0.5);
        }

        .feedback.correct {
            display: block;
            background: rgba(72, 187, 120, 0.3);
            border: 1px solid rgba(72, 187, 120, 0.5);
        }

        /* Join Screen */
        .join-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .join-screen img {
            width: 100px;
            margin-bottom: 20px;
        }

        .join-screen h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .join-input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .join-input::placeholder {
            color: #a0aec0;
        }

        .join-btn {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Loading */
        .loading {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading img {
            width: 80px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Completed Screen */
        .completed-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .completed-screen .trophy {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .completed-screen h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .completed-screen .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #ffc107;
            margin: 20px 0;
        }

        .completed-screen .stats-summary {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            width: 100%;
            max-width: 300px;
        }

        .completed-screen .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .completed-screen .stat-row:last-child {
            border-bottom: none;
        }

        .view-results-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Error Screen */
        .error-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .error-screen h2 {
            margin-bottom: 15px;
        }

        .error-screen p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .error-screen a {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Join Screen (for guests without name) -->
        <div id="join-screen" class="join-screen" style="display: none;">
            <img src="bee4.png" alt="Wizbee">
            <h1>Join Homework</h1>
            <input type="text" id="playerNameInput" class="join-input" placeholder="Enter your name" maxlength="20">
            <button id="joinBtn" class="join-btn">Start Homework</button>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <img src="bee4.png" alt="Loading...">
            <p style="margin-top: 15px;">Loading...</p>
        </div>

        <!-- Error Screen -->
        <div id="error-screen" class="error-screen" style="display: none;">
            <h2 id="errorTitle">Oops!</h2>
            <p id="errorMessage">Something went wrong.</p>
            <a href="index.html">Return to Home</a>
        </div>

        <!-- Game Play Screen -->
        <div id="game-screen" style="display: none;">
            <div class="game-header">
                <div class="homework-badge">Homework: <span id="themeDisplay">Theme</span></div>
                <div class="player-name-display" id="playerNameDisplay">Student</div>
            </div>

            <div class="word-progress">
                Word <span id="currentWord">1</span> of <span id="totalWords">10</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="clue-section">
                <div class="clue-label">Clue</div>
                <div class="clue-text" id="clueText">Loading...</div>
            </div>

            <div class="word-boxes" id="wordBoxes"></div>

            <div class="feedback" id="feedback"></div>

            <div class="input-section">
                <input type="text" id="guessInput" class="guess-input" placeholder="Type your guess..." autocomplete="off" autocapitalize="characters">
                <button id="submitBtn" class="submit-btn">Submit</button>
                <button id="giveUpBtn" class="give-up-btn">I Give Up</button>
            </div>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="guessCount">0</div>
                    <div class="stat-label">Guesses</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="solvedCount">0</div>
                    <div class="stat-label">Solved</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="timeElapsed">0s</div>
                    <div class="stat-label">Time</div>
                </div>
            </div>
        </div>

        <!-- Completed Screen -->
        <div id="completed-screen" class="completed-screen" style="display: none;">
            <div class="trophy">&#127942;</div>
            <h1>Homework Complete!</h1>
            <p>Great job finishing your assignment!</p>
            <div class="score-display"><span id="finalScore">0</span>/<span id="finalTotal">10</span></div>
            <div class="stats-summary">
                <div class="stat-row">
                    <span>Words Solved</span>
                    <span id="finalSolved">0</span>
                </div>
                <div class="stat-row">
                    <span>Total Guesses</span>
                    <span id="finalGuesses">0</span>
                </div>
                <div class="stat-row">
                    <span>Total Time</span>
                    <span id="finalTime">0s</span>
                </div>
            </div>
            <button id="viewResultsBtn" class="view-results-btn">View Leaderboard</button>
        </div>
    </div>

    <script src="homework-play.js"></script>
</body>
</html>
